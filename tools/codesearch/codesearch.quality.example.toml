# 质量优先配置：显式向 SiliconFlow 发送代码向量输入和重排候选正文，可能产生费用。
# 用 --config 指定本文件；原项目配置不修改。首次使用或输入上限变化后需重新索引。
[embedding]
provider = "openai_compatible"
base_url = "https://api.siliconflow.cn/v1"
model = "BAAI/bge-m3"
api_key_env = "SILICONFLOW_API_KEY"
dimensions = 1024
batch_size = 16
max_concurrency = 1
# 采用真实 PHP 补测可完成索引的字符上限，不等于精确 tokenizer 保证。
max_input_chars = 6000

[rerank]
base_url = "https://api.siliconflow.cn/v1"
model = "Qwen/Qwen3-Reranker-8B"
api_key_env = "SILICONFLOW_API_KEY"
timeout_secs = 60
max_candidates = 160
max_input_chars = 6000
