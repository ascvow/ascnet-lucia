[package]
name = "codesearch"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["ascvow"]
license = "MIT"
description = "供 Coding Agent 使用的本地代码语义搜索工具：Tree-sitter 分块 + SQLite/FTS5 + USearch，通过 CLI 与 MCP stdio 暴露。"
publish = false

# codesearch 是独立可执行工具，依赖 SQLite、Tree-sitter 语法和 USearch 的原生编译。
# 刻意作为独立 workspace 存在，避免给 Lucia 主 workspace 的 clippy/test 增加 C/C++ 构建前置。
[workspace]

[lib]
name = "codesearch"
path = "src/lib.rs"

[[bin]]
name = "codesearch"
path = "src/main.rs"

[features]
default = []
# 仅测试使用的确定性 Mock Embedding Provider；生产配置无法选择它。
test-support = []

[dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive", "env"] }
globset = "0.4"
ignore = "0.4"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util", "signal", "process"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.2.1"
tree-sitter-haskell = "0.23.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1.2"
usearch = "2.26"

[dev-dependencies]
codesearch = { path = ".", features = ["test-support"] }
rmcp = { version = "3.2", features = ["client", "transport-child-process"] }
tempfile = "3"
# 集成测试用本地 HTTP Embedding 服务验证真实协议，需要 TcpListener。
tokio = { version = "1", features = ["net"] }

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0
opt-level = 1
