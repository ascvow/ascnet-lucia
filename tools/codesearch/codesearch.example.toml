# codesearch 示例配置。
#
# 复制到工作目录根下命名为 codesearch.toml 后按需修改。
# 本文件只写环境变量名，绝不写入真实凭证。
#
# 所有字段都有默认值，可以只保留需要修改的部分。

[embedding]
# "none" 表示不配置模型：只做符号与全文检索，不会向任何服务发送源码。
# "openai_compatible" 走标准 /embeddings 协议，本地与远程服务都适用。
provider = "openai_compatible"

# --- 示例 A：硅基流动（SiliconFlow）免费向量模型 ---
# BAAI/bge-m3 在硅基流动属于免费模型（带 "Pro/" 前缀的同名模型是收费版）。
# 免费模型需要完成实名认证，且速率上限固定（不随付费用量等级提升）。
base_url = "https://api.siliconflow.cn/v1"
model = "BAAI/bge-m3"
# 只写变量名。使用前先 export SILICONFLOW_API_KEY=...
api_key_env = "SILICONFLOW_API_KEY"
# bge-m3 固定输出 1024 维。写明维度可以省掉一次探测请求，并在服务换模型时立刻报错。
dimensions = 1024
# 该服务不接受请求体中的 dimensions 参数（会返回 400），因此保持关闭。
# 只有 OpenAI text-embedding-3-* 这类支持按维度截断的服务才需要开启。
send_dimensions = false
# 免费额度速率有限，批量小一些、并发低一些更稳；429 会自动退避重试。
batch_size = 16
max_concurrency = 1
max_retries = 5
timeout_secs = 60

# --- 示例 B：OpenAI ---
# base_url = "https://api.openai.com/v1"
# model = "text-embedding-3-small"
# api_key_env = "OPENAI_API_KEY"
# dimensions = 1536
# send_dimensions = true   # 该模型支持按维度截断

# --- 示例 C：本地推理服务（llama.cpp / Xinference / Ollama 等）---
# base_url = "http://127.0.0.1:8080/v1"
# model = "bge-m3"
# api_key_env = ""          # 留空表示不发送 Authorization 头
# dimensions = 1024

# 模型修订标识。同名模型换权重后改这里，旧向量不再被复用。
cache_namespace = ""

# 部分模型要求区分查询与文档输入。bge-m3 不需要前缀，留空即可。
# 前缀参与 Embedding 空间身份：改动后旧向量会被判定为不同空间。
query_prefix = ""
document_prefix = ""

# 单个文档输入的最大字符数，超出在行边界截断并在结果中标记。
max_input_chars = 16000
# 单个代码块的最大失败次数，超过后标记 failed 不再重试。
max_chunk_attempts = 5

[index]
# 自定义排除规则，与内置默认规则叠加。
exclude = []
# 只索引这些 glob；为空表示不限制。
include = []
# 是否启用内置噪声目录规则（.git、node_modules、target、dist 等）。
default_excludes = true
# 是否启用内置敏感文件规则（.env、私钥、凭证等）。
# 注意：这不是安全边界，也不保证识别全部秘密信息。
default_sensitive_excludes = true
# 追加的敏感文件规则，与噪声过滤分开配置。
sensitive_excludes = []
# 是否遵循 .gitignore 与 .codesearchignore。
# 注意：.gitignore 只用于降噪，不是安全边界。
respect_gitignore = true
# 单个文件大小上限（字节），超过则跳过并记录原因。
max_file_size_bytes = 1048576
# 解析阶段的并行度；0 表示按 CPU 核心数自动决定。
parallelism = 0
# 是否在每次查询前做一次增量扫描，让刚保存的文件立即可搜。
refresh_on_search = true
# 低频校验扫描间隔（秒）。仅在 serve --watch 时生效。
# 代码默认值是 0（关闭）；这里显式打开，用于兜底文件监听漏事件的情况。
verify_interval_secs = 3600

[chunk]
# 以下均为**估算** token 数：没有精确 tokenizer，不保证满足精确上限。
target_tokens = 500
max_tokens = 1200
# 小于该值的相邻声明可以合并成一个块。
merge_below_tokens = 120
# 单块最大字符数，作为估算之外的保守兜底。
max_chars = 8000

[retrieval]
fts_top_k = 50
vector_top_k = 80
# 作用域过滤后候选不足时，向量召回的最大 over-fetch 倍数。
vector_overfetch_max = 8
candidate_limit = 40
max_results = 10
max_results_cap = 50
token_budget = 6000
token_budget_cap = 60000
# 字面量搜索最多扫描的文件数。
literal_scan_limit = 5000
# RRF 常数：score(d) = Σ weight_i / (k + rank_i(d))
rrf_k = 60.0
# 三路权重默认相等。此时各通道首位的 RRF 得分同为 1/(k+1)，并列由"精确命中优先"
# 的排序规则处理，不需要靠调权重把逐字命中顶上去。
# 调高本项会连带放大符号后缀、路径片段这类弱精确匹配，在自然语言查询上反而更差。
weight_exact = 1.0
weight_fts = 1.0
weight_vector = 1.0
# 完整符号精确命中至少保留的结果数，避免被语义近似结果淹没。
exact_reserve = 3

[watch]
# 连续保存的去抖窗口（毫秒）。
debounce_ms = 300
# 待处理路径队列上限，超过后退化为整目录重扫。
max_pending_paths = 2000
checkpoint_interval_secs = 60
