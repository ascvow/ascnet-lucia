[workspace]
members = [
    "crates/ascnet-lucia-tool",
    "crates/ascnet-lucia-plugin",
    "crates/ascnet-lucia-plugin-host",
    "crates/ascnet-lucia-plugin-manager",
    "crates/ascnet-lucia-core",
    "crates/ascnet-lucia-agent-runtime",
    "crates/ascnet-lucia-session",
    "examples/basic-cli",
    "crates/ascnet-lucia-tui",
]
resolver = "2"

# Independent WASM plugins are intentionally excluded from the native workspace.
# 独立 WASM 插件不加入原生 workspace，避免 `cargo check` 在宿主 target 上构建 component exports。
exclude = [
    "examples/plugins/echo-plugin",
    "examples/plugins/context-plugin",
    "examples/plugins/mcp-plugin",
    "examples/plugins/skill-plugin",
    "examples/plugins/ui-showcase-plugin",
    "examples/plugins/agent-runtime-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = { version = "46", features = ["component-model", "async"] }
wasmtime-wasi = "46"
wit-bindgen = "0.59"

# 发布产物优先控制分发体积；调试构建保留完整符号，不能用于打包。
[profile.release]
codegen-units = 1
opt-level = "s"
strip = true
lto = true
