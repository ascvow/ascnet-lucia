[workspace]
members = [
    "crates/agent-tool",
    "crates/agent-plugin-protocol",
    "crates/agent-plugin",
    "crates/agent-plugin-host",
    "crates/agent-plugin-manager",
    "crates/agent-core",
    "crates/agent-runtime",
    "crates/agent-session",
    "crates/agent-evolution-protocol",
    "examples/basic-cli",
    "crates/agent-tui",
    "examples/plugins/echo-plugin",
    "examples/plugins/context-plugin",
    "examples/plugins/context-plugin/smoke-tests",
    "examples/plugins/mcp-plugin",
    "examples/plugins/mcp-plugin/smoke-tests",
    "examples/plugins/skill-plugin",
    "examples/plugins/skill-plugin/smoke-tests",
    "examples/plugins/command-plugin",
    "examples/plugins/command-plugin/crates/command-protocol",
    "examples/plugins/command-plugin/crates/command-sdk",
    "examples/plugins/command-plugin/smoke-tests",
    "examples/plugins/teammate-plugin",
    "examples/plugins/teammate-plugin/smoke-tests",
    "examples/plugins/agent-runtime-plugin",
    "examples/plugins/agent-runtime-plugin/smoke-tests",
    "examples/plugins/ui-showcase-plugin",
    "examples/plugins/workflow-plugin",
    "examples/plugins/workflow-plugin/smoke-tests",
    "examples/plugins/plan-plugin",
    "examples/plugins/permission-plugin",
    "examples/plugins/permission-plugin/smoke-tests",
    "tools/lucia-live-tests",
]
default-members = [
    "crates/agent-tool",
    "crates/agent-plugin-protocol",
    "crates/agent-plugin",
    "crates/agent-plugin-host",
    "crates/agent-plugin-manager",
    "crates/agent-core",
    "crates/agent-runtime",
    "crates/agent-session",
    "crates/agent-evolution-protocol",
    "examples/basic-cli",
    "crates/agent-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-core = "0.3"
futures-util = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = { version = "46", features = ["component-model", "async"] }
wasmtime-wasi = "46"
wit-bindgen = "0.59"

# 发布产物优先控制分发体积；调试构建保留完整符号，不能用于打包。
[profile.release]
codegen-units = 1
opt-level = "s"
strip = true
lto = true
