[workspace]
members = [
    "crates/agent-core/tool",
    "crates/agent-core/event",
    "crates/agent-plugins/protocol",
    "crates/agent-plugins/sdk",
    "crates/agent-plugins/host",
    "crates/agent-plugins/manager",
    "crates/agent-core/kernel",
    "crates/agent-core/runtime",
    "crates/agent-core/session",
    "crates/agent-core/context",
    "crates/agent-core/skill",
    "examples/basic-cli",
    "crates/agent-tui",
    "examples/plugins/mcp-plugin",
    "examples/plugins/mcp-plugin/smoke-tests",
    "examples/plugins/teammate-plugin",
    "examples/plugins/teammate-plugin/smoke-tests",
    "examples/plugins/agent-runtime-plugin",
    "examples/plugins/agent-runtime-plugin/smoke-tests",
    "examples/plugins/ui-showcase-plugin",
    "examples/plugins/plan-plugin",
    "examples/plugins/plan-plugin/smoke-tests",
    "examples/plugins/memory-plugin",
    "examples/plugins/knowledge-plugin",
    "examples/plugins/eden-plugin",
    "examples/plugins/eden-plugin/smoke-tests",
    "examples/plugins/permission-plugin",
    "examples/plugins/permission-plugin/smoke-tests",
]
default-members = [
    "crates/agent-core/tool",
    "crates/agent-core/event",
    "crates/agent-plugins/protocol",
    "crates/agent-plugins/sdk",
    "crates/agent-plugins/host",
    "crates/agent-plugins/manager",
    "crates/agent-core/kernel",
    "crates/agent-core/runtime",
    "crates/agent-core/session",
    "crates/agent-core/context",
    "crates/agent-core/skill",
    "examples/basic-cli",
    "crates/agent-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "2.2.0"
futures-core = "0.3"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
semver = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = { version = "48.0.7", features = ["component-model", "async"] }
wasmtime-wasi = "48.0.7"
wit-bindgen = "0.59"

# 静态检查策略：`bun run check` 用 `-D warnings` 把全部告警升级为错误，因此放行清单
# 只能放在这里，且每一项都必须说明为什么无法在源码中消除。
[workspace.lints.clippy]
# `async_trait` 会为生成的 trait 方法补上 `#[must_use]`，而返回类型（`Result`、
# `Self` 等）本身已带 `must_use`；告警指向宏展开，改动我们自己的源码无法消除。
double_must_use = "allow"

# 开发与测试构建只为工作区代码保留行号，第三方依赖不生成调试符号。
# 关闭增量编译可避免频繁切换 feature 和测试目标后长期积累历史缓存。
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

# 发布产物优先控制分发体积，不能使用调试 profile 打包。
[profile.release]
codegen-units = 1
opt-level = "s"
strip = true
lto = true
