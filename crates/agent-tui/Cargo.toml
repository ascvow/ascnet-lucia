[package]
name = "lucia"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lucia ReAct 智能体的交互式终端界面。"

[features]
# Regular builds include plugins; use `--no-default-features` for the isolated Core binary.
# 常规构建默认提供插件能力；纯 Core 产物使用 `--no-default-features` 保持依赖边界。
default = ["plugins"]
plugins = [
    "dep:agent-plugin-protocol",
    "dep:agent-plugin-host",
    "dep:agent-plugin-manager",
    "dep:agent-runtime",
]

[dependencies]
anyhow.workspace = true
agent-core = { path = "../agent-core/kernel", default-features = false, features = ["openai", "anthropic"] }
agent-context = { path = "../agent-core/context" }
agent-evolution = { path = "../agent-evolution/engine" }
agent-evolution-protocol = { path = "../agent-evolution/protocol" }
agent-plugin-protocol = { path = "../agent-plugins/protocol", optional = true }
agent-plugin-host = { path = "../agent-plugins/host", optional = true }
agent-plugin-manager = { path = "../agent-plugins/manager", optional = true }
agent-runtime = { path = "../agent-core/runtime", optional = true }
agent-session = { path = "../agent-core/session" }
agent-skill = { path = "../agent-core/skill" }
agent-tool = { path = "../agent-core/tool" }
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
# bracketed-paste：接收终端粘贴事件，用于把拖入的文件路径转换为附件
crossterm = { version = "0.28", features = ["bracketed-paste"] }
futures-util.workspace = true
ratatui = "0.29"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
toml.workspace = true
# Markdown 转 ratatui Text；关闭默认的 syntect 代码高亮以减小依赖
tui-markdown = { version = "=0.3.3", default-features = false }
unicode-width = "0.2"
