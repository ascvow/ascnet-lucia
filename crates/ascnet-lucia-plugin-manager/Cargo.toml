[package]
name = "agent-plugin-manager"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "Lucia 的本地插件安装、状态管理和完整性诊断。"

[dependencies]
anyhow = "1"
agent-plugin-host = { path = "../ascnet-lucia-plugin-host", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"

[[bin]]
name = "lucia-plugin"
path = "src/main.rs"
