[package]
name = "lucia"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lucia ReAct 智能体的交互式终端界面。"

[features]
# 默认发布纯 Core TUI；插件版必须显式启用，避免把 Wasmtime 带入基础包。
default = []
plugins = ["dep:agent-plugin-host"]

[dependencies]
anyhow.workspace = true
agent-core = { path = "../ascnet-lucia-core", default-features = false, features = ["openai", "anthropic"] }
agent-plugin-host = { path = "../ascnet-lucia-plugin-host", optional = true }
agent-session = { path = "../ascnet-lucia-session" }
agent-tool = { path = "../ascnet-lucia-tool" }
async-trait.workspace = true
clap.workspace = true
crossterm = "0.28"
ratatui = "0.29"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
# Markdown 转 ratatui Text；关闭默认的 syntect 代码高亮以减小依赖
tui-markdown = { version = "=0.3.3", default-features = false }
unicode-width = "0.2"
