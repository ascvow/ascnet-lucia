[package]
name = "agent-plugin-manager"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "Lucia 的插件获取、安装、状态管理和完整性诊断。"

[dependencies]
anyhow = "1"
agent-plugin-host = { path = "../host", default-features = false }
futures-util = "0.3"
reqwest = { workspace = true }
semver = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
