[package]
name = "agent-plugin-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ascnet-lucia 的插件宿主、WASM 运行时和 UI 协议。"

[features]
default = ["wasm"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
anyhow.workspace = true
agent-runtime = { path = "../agent-runtime" }
agent-core = { path = "../agent-core", default-features = false }
agent-tool = { path = "../agent-tool", default-features = false }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }

[[bench]]
name = "plugin_overhead"
harness = false
