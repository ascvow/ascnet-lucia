[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ascnet-lucia 的最小 ReAct Agent 核心和模型协议适配层。"

[features]
default = ["openai", "anthropic", "google", "bedrock"]
openai = ["dep:reqwest", "dep:base64"]
anthropic = ["dep:reqwest", "dep:base64", "dep:sha2"]
google = ["dep:reqwest", "dep:base64"]
bedrock = ["dep:reqwest", "dep:base64", "dep:sha2", "dep:hmac", "dep:hex"]

[dependencies]
anyhow.workspace = true
agent-event = { path = "../event", version = "0.1.0" }
agent-tool = { path = "../tool", version = "0.1.0", default-features = false }
async-trait.workspace = true
base64 = { workspace = true, optional = true }
futures-util.workspace = true
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
