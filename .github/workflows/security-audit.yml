name: Dependency security audit

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/security-audit.yml'
  push:
    branches: [master, main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '21 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit native and independent guest lockfiles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t locks < <(git ls-files '*Cargo.lock')
          for lock in "${locks[@]}"; do
            echo "Auditing $lock"
            cargo audit --file "$lock" --deny warnings
          done
