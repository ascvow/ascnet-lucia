[plugin]
id = "agent-runtime"
name = "Agent Runtime 能力展示插件"
version = "0.1.0"
api_version = "0.6.0"
wasm = "target/wasm32-wasip2/release/agent_runtime_plugin.wasm"
description = "通过受限宿主 API 展示 Agent 派生、观察、取消和通信能力。"

[capabilities.agent]
spawn = true
observe = true
cancel = true
profiles = ["worker"]
