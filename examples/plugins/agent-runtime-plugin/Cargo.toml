[package]
name = "agent-runtime-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "展示 Lucia Agent Runtime 宿主能力的 WASM 测试插件。"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/agent-plugin" }
serde_json = "1"
wit-bindgen = "0.59"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

# 该 WASM Guest 独立于原生 workspace 构建，避免宿主 target 编译 component exports。
[workspace]
