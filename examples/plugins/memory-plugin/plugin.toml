[plugin]
id = "memory"
name = "Memory Plugin"
version = "0.1.0"
api_version = "0.10.0"
wasm = "target/wasm32-wasip2/release/memory_plugin.wasm"
description = "跨会话保留用户偏好与项目约定，并在每次模型请求前注入。"

[capabilities]
# 记忆插件只读写自己的持久存储，不申请文件、网络、进程或密钥能力。
storage = true

[capabilities.tool_scopes]
memory_record = "control"
memory_list = "control"
memory_forget = "control"
