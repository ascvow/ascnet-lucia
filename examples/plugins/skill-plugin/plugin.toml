[plugin]
id = "skill"
name = "Lucia 官方 Skill 插件"
version = "0.1.0"
api_version = "0.7.0"
wasm = "target/wasm32-wasip2/release/skill_plugin.wasm"
description = "扫描本地 SKILL.md，向模型注入描述并按需加载完整指令。"

[[provides]]
id = "agent.skills"
version = "1.0.0"
mode = "multi"

[capabilities]
fs_read = ["skills"]

[metadata]
skills_dir = "skills"
