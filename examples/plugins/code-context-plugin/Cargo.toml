[package]
name = "code-context-plugin"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "为 Agent 提供 code_search 的仓库上下文引擎 WASM 插件。"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/agent-plugins/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wit-bindgen = "0.59"
# 向量与元数据同库。SQLite 是 C 代码，编译到 wasm32-wasip2 需要 wasi-sdk 提供 sysroot，
# 构建方式见 README；这条依赖刻意留在插件里，Lucia 本体不因此增加任何构建前置。
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1.9", optional = true }

# 结构化解析一律使用现成的纯 Rust 解析器，不自建语法分析。
# 选型理由与 tree-sitter 的对比见 docs/code-context-engine/adr-structural-parsing.md：
# 这些 crate 没有 C 依赖，可直接编译到 wasm32-wasip2，因此原 ADR 中"缺 C 工具链只能手写
# Tier 2 解析器"的前提不再成立。
syn = { version = "3", features = ["full", "parsing"] }
# syn 的行号来自 proc-macro2 的 fallback span，必须显式开启该 feature 才有 line/column。
proc-macro2 = { version = "1", features = ["span-locations"] }
oxc_allocator = "0.148"
oxc_ast = "0.148"
oxc_parser = "0.148"
oxc_span = "0.148"
# 只负责 SFC 标签和源码偏移；脚本语法继续由 Oxc 所有，不引入浏览器或 Host 依赖。
html5gum = { version = "0.8.4", default-features = false }
rustpython-parser = "0.4"
gosyn = "0.2"

[features]
# 默认启用向量库：它是 WASM 正式路径的持久化后端，不再只是原生示例的可选项。
default = ["sqlite-vector-store"]
test-support = ["sqlite-vector-store"]
sqlite-vector-store = ["dep:rusqlite", "dep:sqlite-vec"]

[[example]]
name = "search_repository"
required-features = ["test-support"]

[[example]]
name = "search_playground"
required-features = ["test-support"]

[dev-dependencies]
code-context-plugin = { path = ".", features = ["test-support"] }
ureq = "3"
url.workspace = true
