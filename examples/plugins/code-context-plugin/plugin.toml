[plugin]
id = "code-context"
name = "Code Context Engine"
version = "0.1.0"
api_version = "0.10.0"
wasm = "target/wasm32-wasip2/release/code_context_plugin.wasm"
description = "为 Agent 提供可分片构建、增量更新的 code_search 仓库上下文引擎。"

# 通过 Core 已有工具生命周期感知 Agent 写入；只在成功终态后把安全的仓库相对路径加入
# 脏集合，不申请文件 watcher，也不参与工具准入或事件改写。
[[events]]
name = "core.tool.call"
ignore_cancelled = true

[[events]]
name = "core.tool.result"
priority = "monitor"

# 运行取消或异常收尾时清理没有结果的待处理写入。
[[events]]
name = "core.run.finish"
priority = "monitor"

[capabilities]
# 插件启动时只列出一次仓库根以确认 Host 已注入可信读取边界；索引在首次 code_search 时
# 按 fuel 预算分片构建，后续写入通过事件触发文件级增量更新。
workspace_read = true

# 索引 manifest 与仓库元数据跨插件版本保留，必须用 storage 而不是实例状态：
# 一次插件重建就清空用户索引会让功能本身不成立。
storage = true

# 本插件刻意不申请的能力，逐项说明，避免后来者误以为是遗漏：
#
# process_exec   —— 明确否决：它会把本插件全部工具的 scope 抬到 shell，
#                   使 code_search 每次调用都需要审批，与产品目标冲突。
# sessions       —— 明确否决：会把工具 scope 下限抬到 unknown，且与代码检索无关。

# API 嵌入与候选模型重排访问用户自配的兼容端点。base_url 与密钥由宿主从应用配置注入，
# 插件只提交相对路径，看不到地址也拿不到凭证。模型重排会发送候选源码片段。
#
# allow_hosts 是用户与审计者能看到的授权边界：宿主注入的 base_url 必须落在其中，
# 否则请求在能力层被拒绝。换用自建端点或其他服务商时，必须同步改这里——
# 这条约束是刻意的，它保证 manifest 上写明的边界始终是真实生效的边界。
[capabilities.http]
allow_hosts = [
    "api.openai.com",
    "api.siliconflow.cn",
    "dashscope.aliyuncs.com",
    "open.bigmodel.cn",
    "api.deepseek.com",
]

[capabilities.tool_scopes]
# code_search 只读取仓库源码并返回位置，声明的权限语义等同于读文件。
#
# 但**实际生效的 scope 是 unknown**，这里的 read 只是声明值。原因是 Host 的能力下限
# 合并规则（manifest.rs 的 component_capability_scope_floor 与 merge_tool_permission_scopes）：
# workspace_read 贡献 read，http 贡献 network，两个不相等且都不是 control 的 scope
# 合并后落到 unknown——WASM 无法证明某个工具内部不会调用网络，这条下限不可绕过。
#
# 代价是明确的：code_search 进入最保守的审批档位，且不再参与 run.rs 的只读并行批处理。
# 这是启用 API 语义检索换来的，不是疏漏。不需要语义检索的部署删掉上面的
# [capabilities.http] 段即可，scope 会自动回落到 read。
code_search = "read"
