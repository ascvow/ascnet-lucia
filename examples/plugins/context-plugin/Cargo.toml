[package]
name = "context-plugin"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "管理并压缩 Lucia Agent 上下文的官方 WASM 插件。"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/ascnet-lucia-plugin" }
serde_json = "1"
wit-bindgen = "0.59"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
