[plugin]
id = "context"
name = "上下文压缩插件"
version = "0.1.0"
api_version = "0.7.0"
wasm = "target/wasm32-wasip2/release/context_plugin.wasm"
description = "支持自动水位与 /compact 主动触发的上下文压缩。"

[[provides]]
id = "agent.context-loader"
version = "1.0.0"
mode = "exclusive"

[capabilities]
# 完整压缩使用应用固定的 provider/model 执行无工具摘要调用。
model_completion = true
