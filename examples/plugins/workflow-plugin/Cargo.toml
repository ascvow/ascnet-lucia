[package]
name = "workflow-plugin"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "基于 Agent Runtime 的动态任务列表工作流插件。"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/agent-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
wit-bindgen = "0.59"
