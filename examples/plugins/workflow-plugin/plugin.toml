[plugin]
id = "workflow"
name = "动态工作流插件"
version = "0.2.0"
api_version = "0.9.0"
wasm = "target/wasm32-wasip2/release/workflow_plugin.wasm"
description = "以动态任务列表编排受限 worker Agent，就绪任务自动调度执行。"

[capabilities.agent]
spawn = true
observe = true
cancel = true
profiles = ["worker"]

[capabilities.tool_scopes]
task_create = "unknown"
task_update = "unknown"
task_list = "control"
task_get = "control"
