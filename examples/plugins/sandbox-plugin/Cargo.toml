[package]
name = "sandbox-plugin"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "限制 Agent 工具调用并提供交互审批界面的 WASM 插件。"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-plugin = { path = "../../../crates/agent-plugin" }
serde_json = "1"
wit-bindgen = "0.59"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[workspace]
