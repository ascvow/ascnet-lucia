[package]
name = "teammate-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "提供受限 Agent 成员管理与有界邮箱的官方 WASM 插件。"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/agent-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.59"
