[package]
name = "teammate-plugin-smoke-tests"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Teammate 插件的独立 WASM 端到端测试。"

[workspace]

[dev-dependencies]
anyhow = "1"
agent-core = { path = "../../../../crates/agent-core", default-features = false }
agent-plugin-host = { path = "../../../../crates/agent-plugin-host" }
agent-runtime = { path = "../../../../crates/agent-runtime" }
agent-tool = { path = "../../../../crates/agent-tool", default-features = false }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
