[plugin]
id = "teammate"
name = "Teammate 协作插件"
version = "0.1.0"
api_version = "0.9.0"
wasm = "target/wasm32-wasip2/release/teammate_plugin.wasm"
description = "使用 Agent Runtime 句柄管理成员，并提供有界、可确认的短期邮箱。"

[capabilities.agent]
spawn = true
observe = true
cancel = true
profiles = ["worker"]

[capabilities.tool_scopes]
teammate_spawn = "unknown"
teammate_list = "control"
teammate_status = "control"
teammate_result = "control"
teammate_cancel = "control"
teammate_remove = "control"
teammate_send = "control"
teammate_inbox = "control"
teammate_ack = "control"
teammate_dispatch = "unknown"
