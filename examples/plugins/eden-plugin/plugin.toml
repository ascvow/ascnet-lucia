[plugin]
id = "eden"
name = "Lucia Eden 编辑器上下文插件"
version = "0.2.0"
api_version = "0.10.0"
wasm = "target/wasm32-wasip2/release/eden_plugin.wasm"
description = "把 Eden 编辑器当前选区作为上下文引用自动带给下一条消息；不向模型暴露任何工具。"

# 上下文引用 provider：应用按节拍调用 context.ref 服务，把快照里的内容作为
# 随下一条消息发送的引用。声明该能力是注册服务的资格，也出现在安装审查里。
[[provides]]
id = "agent.context-ref"
version = "1.0.0"
mode = "multi"

[capabilities]
# Eden 启动每个终端窗格时注入这三个变量；宿主默认不继承任何环境变量，只有这里列出的
# 名字才会被注入 WASM 沙箱。
env_read = ["EDEN_SESSION", "EDEN_SOCKET", "EDEN_TOKEN_FILE"]
# 握手令牌只读且路径固定；它同时让本插件全部工具按 unknown 计算权限下限——
# 既能读本地凭证又能连本地服务，副作用无法用单一 scope 描述。
fs_read = ["~/Library/Application Support/Eden/agent.token"]

[capabilities.socket]
# 只允许连接 Eden 自己的 agent socket，逐条精确匹配。
allow_paths = ["~/Library/Application Support/Eden/agent.sock"]
