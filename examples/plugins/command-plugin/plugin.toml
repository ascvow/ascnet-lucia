[plugin]
id = "command"
name = "Command Plugin"
version = "1.0.0"
api_version = "0.7.0"
wasm = "target/wasm32-wasip2/release/command_plugin.wasm"
description = "提供斜杠命令注册、预览、执行和会话选择界面。"

[capabilities]
# 命令插件通过通用宿主动作驱动会话切换、上下文重载与退出等应用级操作。
surface_actions = true

[metadata]
surface_authority = "lucia-tui"

