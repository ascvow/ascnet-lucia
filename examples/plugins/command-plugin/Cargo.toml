[workspace]
members = [".", "crates/command-protocol", "crates/command-sdk"]
resolver = "2"

[package]
name = "command-plugin"
version = "1.0.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "Lucia 官方斜杠命令插件。"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-plugin = { path = "../../../crates/agent-plugin" }
anyhow = "1"
command-protocol = { path = "crates/command-protocol" }
serde = "1"
serde_json = "1"
wit-bindgen = "0.59"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true
