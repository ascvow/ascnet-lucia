[package]
name = "mcp-plugin"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "通过 Lucia 宿主开放 API 加载 stdio MCP Server 的通用插件。"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/ascnet-lucia-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.59"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true
