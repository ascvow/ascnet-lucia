[package]
name = "mcp-plugin"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "通过 Lucia 宿主开放 API 加载 stdio MCP Server 的官方插件。"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/agent-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.59"
