[package]
name = "mcp-plugin-smoke-tests"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "通用 MCP 插件的独立端到端测试。"

[dev-dependencies]
agent-core = { path = "../../../../crates/agent-core/kernel", default-features = false }
agent-plugin-host = { path = "../../../../crates/agent-plugins/host" }
agent-tool = { path = "../../../../crates/agent-core/tool", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
