[plugin]
id = "knowledge"
name = "Knowledge Plugin"
version = "0.2.0"
api_version = "0.10.0"
wasm = "target/wasm32-wasip2/release/knowledge_plugin.wasm"
description = "把历史会话按用户轮次建立词法索引，并按消息区间回溯原文。"

[capabilities]
# 只读历史会话作为语料。该能力会把本插件全部工具的权限下限抬到 unknown：
# 会话内容是 Agent 历史上见过的一切的并集，按只读文件对待会低估覆盖面。
sessions = true
# 历史索引跨插件实例保留，避免每次启动重复扫描未变化会话。
storage = true

[capabilities.tool_scopes]
history_search = "control"
history_read = "control"

# TUI 完成会话持久化后，增量同步新会话与变化修订。
[[events]]
name = "tui.run.finish"
