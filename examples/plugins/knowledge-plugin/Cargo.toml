[package]
name = "knowledge-plugin"
version = "0.1.0"
edition = "2021"
authors = ["ascvow"]
license = "MIT"
description = "把历史对话蒸馏为可检索知识库，并按索引回溯对话原文的 WASM 插件。"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
agent-plugin = { path = "../../../crates/agent-plugins/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
wit-bindgen = "0.59"
