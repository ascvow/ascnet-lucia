[plugin]
id = "permission"
name = "Permission Plugin"
version = "0.1.0"
api_version = "0.7.0"
wasm = "target/wasm32-wasip2/release/permission_plugin.wasm"
description = "保护敏感文件，并在 Agent 执行有副作用的工具前请求用户审批。"

[[provides]]
id = "agent.tool-policy"
version = "1.0.0"
mode = "exclusive"

[capabilities]
# 权限插件启动和运行时均不申请文件、网络、进程或密钥能力。
