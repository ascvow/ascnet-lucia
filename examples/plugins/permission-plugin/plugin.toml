[plugin]
id = "permission"
name = "Permission Plugin"
version = "0.1.0"
api_version = "0.7.0"
wasm = "target/wasm32-wasip2/release/permission_plugin.wasm"
description = "保护敏感文件，并在 Agent 执行有副作用的工具前请求用户审批。"

[[provides]]
id = "agent.tool-policy"
version = "1.0.0"
mode = "exclusive"

[capabilities]
# 模型代审只使用 Host 固定的小模型路由；命令完成后通过通用动作清空主输入。
model_completion = true
surface_actions = true
