[plugin]
id = "plan"
name = "Plan Plugin"
version = "0.2.0"
api_version = "0.10.0"
wasm = "target/wasm32-wasip2/release/plan_plugin.wasm"
description = "为困难或大型任务提供计划准入、更新、查询、紧凑进度架和完整计划视图。"

[capabilities]
# 计划插件只使用实例内状态和声明式 UI，不申请文件、网络、进程或密钥能力。

[capabilities.tool_scopes]
update_plan = "control"
get_plan = "control"

# 计划插件只观察运行结束，不参与任何工具准入决策。
[[events]]
name = "core.run.finish"
